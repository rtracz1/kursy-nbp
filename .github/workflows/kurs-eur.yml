name: Kurs EUR
on:
  workflow_dispatch:
  schedule:
    - cron: '20 12 * * 1-5'

permissions:
  contents: write

jobs:
  pobierz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Pobierz kurs (extract + transform)
        run: |
          mkdir -p dane
          curl -sf "https://api.nbp.pl/api/exchangerates/rates/a/eur/?format=json" -o eur.json
          jq -r '.rates[0] | "\(.effectiveDate),\(.mid)"' eur.json >> dane/eur.csv
          rm eur.json
          echo "Zawartość pliku:"; cat dane/eur.csv

      - name: Zapisz w repozytorium (load)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dane/eur.csv
          git commit -m "Kurs EUR $(date -u +%F)" || echo "Brak zmian do zapisania"
          git push
